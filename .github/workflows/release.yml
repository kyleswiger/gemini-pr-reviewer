# Semver releases, matching aws-deployment-tooling, aws-reusable-workflows, and
# cabin-management: conventional commits on main -> release-please opens a
# release PR -> merging it tags vX.Y.Z, cuts a GitHub Release, and updates
# CHANGELOG.md.
#
# Deploys are still a manual `terraform apply` here (see README) — a release is
# a changelog and a name for what shipped.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: simple
