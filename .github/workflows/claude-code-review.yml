name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write (not read) so the review can actually be posted: the code-review
      # plugin uses `gh pr comment` and the inline-comment MCP tool.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is required. Without it the plugin prints the review to the
          # runner's stdout and explicitly stops before posting anything.
          prompt: '/code-review:code-review --comment https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Deliberately no `claude_args: --allowedTools`. That flag REPLACES the
          # default allowlist rather than extending it, which denied Task/Read/
          # Grep/Glob/TodoWrite and broke the plugin's parallel review agents.
          # The plugin's own command frontmatter declares the tools it needs.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
